name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v6

      - name: Install Rust toolchain for WASM kernel
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # wasm-opt ships in binaryen and is not on the runner image. Without it
      # the build script exits 1 and make reports 2, which is what this job
      # had been doing since the step was introduced.
      - name: Install Binaryen for wasm-opt
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binaryen

      - name: Build routing kernel WASM
        run: make wasm-build

      - name: Prepare static site artifact
        run: |
          set -euxo pipefail
          mkdir -p site/src site/wasm site/fonts site/locales site/data_pipeline/output
          cp web/index.html site/index.html
          cp -R web/src/. site/src/
          cp -R web/locales/. site/locales/
          # Whole dir: the Apache-2.0 licence text ships alongside the font,
          # since serving the site redistributes it (see THIRD_PARTY_NOTICES.md).
          cp -R web/fonts/. site/fonts/
          cp web/wasm/routing-kernel.wasm site/wasm/
          # Every region the picker offers, not just Berlin: web/src/data/
          # locations.json lists 16, and each needs its gzipped graph and its
          # boundary canvas. Shipping only Berlin's left the other fifteen
          # entries selectable but 404ing.
          cp data_pipeline/output/*.bin.gz site/data_pipeline/output/
          cp data_pipeline/output/*-district-boundaries-canvas.json site/data_pipeline/output/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
