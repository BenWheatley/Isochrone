[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isochrone"
version = "0.1.0"
description = "Multi-region isochrone preprocessing pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.4,<3.0",
  "osmium>=4.3,<5.0",
  "pyproj>=3.7,<4.0",
  # 2.34.0 is the first release shipping a py.typed marker. Below that floor
  # mypy sees requests as untyped and the import needs a
  # `# type: ignore[import-untyped]`; at or above it that ignore becomes an
  # error under strict mode's warn_unused_ignores. Pinning the floor keeps
  # water_polygons.py type-checking identically everywhere, instead of the
  # result depending on which side of 2.34.0 pip happened to resolve.
  "requests>=2.34,<3.0",
  "pyshp>=2.3,<3.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "ruff>=0.7",
]

[tool.setuptools]
package-dir = {"" = "data_pipeline/src"}

[tool.setuptools.packages.find]
where = ["data_pipeline/src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["data_pipeline/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = ["data_pipeline/src"]
packages = ["isochrone_pipeline"]
